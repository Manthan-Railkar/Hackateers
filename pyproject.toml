[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pidgey-mcp"
version = "2.1.1"
description = "Token-Optimized Middleware Engine & DOM Checkpointing Framework for AI Browser Automation"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Manthan Railkar", email = "manthan.railkar@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "browser-automation",
    "playwright",
    "dom-compression",
    "ai-agents",
    "llms.txt",
    "pidgey",
    "browser-optimizer"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "mcp>=1.30.0",
    "fastmcp>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    "lxml>=4.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "xxhash>=3.0.0",
    "cachetools>=5.0.0",
    "websockets>=12.0",
    "tiktoken>=0.5.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/Manthan-Railkar/Hackateers"
Repository = "https://github.com/Manthan-Railkar/Hackateers.git"
Documentation = "https://github.com/Manthan-Railkar/Hackateers/blob/main/docs.md"
"Bug Tracker" = "https://github.com/Manthan-Railkar/Hackateers/issues"

[project.scripts]
browser-optimizer = "browser_optimizer.cli:main"
pidgey = "browser_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"browser_optimizer.dashboard" = ["*.html", "*.css", "*.js"]
"browser_optimizer" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
